version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  exclusions:
    rules:
      # Tests read and write the temp files they create.
      - path: _test\.go
        linters: [gosec]
      # Binary wire codecs (NBT, the Minecraft protocol, TrueType): converting
      # between integer widths is the format itself (two's complement, fixed widths).
      - path: internal/core/(nbt|slp|ttf)/
        linters: [gosec]
        text: G115
      # COM through method tables: every call hands pointers over as uintptr
      # (call is //go:uintptrescapes, so they stay alive and in place).
      - path: internal/focusmute/watcher_windows\.go
        linters: [gosec]
        text: G103
