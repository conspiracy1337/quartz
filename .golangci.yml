version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  exclusions:
    rules:
      # Tests read and write the temp files they create.
      - path: _test\.go
        linters: [gosec]
      # Binary wire codecs (NBT, the Minecraft protocol): converting between
      # integer widths is the format itself (two's complement, fixed widths).
      - path: internal/core/(nbt|slp)/
        linters: [gosec]
        text: G115
