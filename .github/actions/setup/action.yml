name: Set up the build
description: >
  Go from go.mod, and for jobs that build the app: the native libraries
  (Linux), Node and pnpm, the frontend (main.go embeds frontend/dist) and
  optionally the wails CLI at the version in go.mod. Caches stay off: a
  release must not be built from a cache another run wrote.

inputs:
  app:
    description: Build the frontend and its toolchain (false for jobs that only run tools/release).
    default: "true"
  wails:
    description: Install the wails CLI.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Native libraries
      if: inputs.app == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -yq --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: inputs.app == 'true'
      with:
        package_json_file: frontend/package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.app == 'true'
      with:
        node-version: "24"
        package-manager-cache: false

    - name: Frontend
      if: inputs.app == 'true'
      shell: bash
      working-directory: frontend
      run: |
        pnpm install --frozen-lockfile
        pnpm run build

    - name: wails CLI
      if: inputs.wails == 'true'
      shell: bash
      run: |
        go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
