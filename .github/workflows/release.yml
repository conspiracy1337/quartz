# Pushing a vX.Y.Z tag releases the launcher: every check, a test run on
# real Windows and macOS, the builds for every platform, then (once you
# approve the release environment) one signed update.json for all of them
# and the GitHub release that installed launchers update from.
#
# Only the publish job sees the signing key: it lives in the release
# environment, which waits for your approval and accepts only v* tags.
# One-time setup and the release steps: changelog/README.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Version and notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          if ! [[ "$v" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]]; then
            echo "::error::tag $TAG isn't vX.Y.Z"; exit 1
          fi
          if ! [[ -s "changelog/$v.md" ]]; then
            echo "::error::changelog/$v.md is missing or empty: write the release notes first"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          wails: "true"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true
      - run: ./check.sh

  test-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: go test ./...

  build:
    needs: [meta, check, test-native]
    strategy:
      matrix:
        include:
          - { name: linux-windows, os: ubuntu-24.04, targets: linux-amd64 windows-amd64 windows-arm64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, targets: linux-arm64 }
          - { name: macos, os: macos-15, targets: darwin-universal }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          wails: "true"
      - name: Public key
        env:
          PUB: ${{ vars.QUARTZ_RELEASE_PUBKEY }}
        run: |
          if [[ -z "$PUB" ]]; then echo "::error::the QUARTZ_RELEASE_PUBKEY repository variable isn't set"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PUB" > "$RUNNER_TEMP/keys/quartz.pub"
          echo "QUARTZ_RELEASE_KEYS=$RUNNER_TEMP/keys" >> "$GITHUB_ENV"
      - name: Build
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TARGETS: ${{ matrix.targets }}
          QUARTZ_MSA_CLIENT_ID: ${{ secrets.QUARTZ_MSA_CLIENT_ID }}
          QUARTZ_CF_API_KEY: ${{ secrets.QUARTZ_CF_API_KEY }}
          QUARTZ_DISCORD_CLIENT_ID: ${{ secrets.QUARTZ_DISCORD_CLIENT_ID }}
        run: |
          read -ra targets <<< "$TARGETS"
          go run ./tools/release build "$VERSION" "${targets[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          include-hidden-files: true # .builds.json: which version built each file
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          app: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/builds
      - name: Collect the builds
        run: |
          mkdir dist
          jq -s add "$RUNNER_TEMP"/builds/*/.builds.json > dist/.builds.json
          find "$RUNNER_TEMP/builds" -type f ! -name .builds.json -exec mv -n -t dist {} +
          ls -la dist
      - name: Signing key
        env:
          PUB: ${{ vars.QUARTZ_RELEASE_PUBKEY }}
          KEY: ${{ secrets.QUARTZ_RELEASE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PUB" > "$RUNNER_TEMP/keys/quartz.pub"
          printf '%s' "$KEY" > "$RUNNER_TEMP/keys/quartz.key"
          echo "QUARTZ_RELEASE_KEYS=$RUNNER_TEMP/keys" >> "$GITHUB_ENV"
      - name: Sign update.json
        env:
          QUARTZ_RELEASE_PASSPHRASE: ${{ secrets.QUARTZ_RELEASE_PASSPHRASE }}
        run: go run ./tools/release manifest "$VERSION" "changelog/$VERSION.md"
      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Quartz Client $VERSION" --notes-file "changelog/$VERSION.md"
